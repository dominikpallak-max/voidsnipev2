name: build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -name "*.zip" | head -1)
          fi
          echo "Znaleziono archiwum: $ZIP"
          mkdir -p proj
          unzip -oq "$ZIP" -d proj
          
          PROJECT_DIR=$(dirname "$(find proj -name "build.gradle" | head -1)")
          echo "Katalog projektu: $PROJECT_DIR"
          
          gradle -p "$PROJECT_DIR" build

      - uses: actions/upload-artifact@v4
        with:
          name: snipe-void
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            
